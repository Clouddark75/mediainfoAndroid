name: Android Build CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          echo "y" | sdkmanager --install "ndk;27.2.12479018" --channel=0
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Install CMake
        run: |
          echo "y" | sdkmanager --install "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build MediaInfo Library (AAR)
        run: ./gradlew :mediainfo-lib:assembleRelease --stacktrace --no-daemon

      - name: Build MediaInfo Demo App (APK)
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon

      - name: Run tests
        run: ./gradlew test --stacktrace --no-daemon
        continue-on-error: true

      - name: Upload AAR artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mediainfo-library-aar
          path: |
            mediainfo-lib/build/outputs/aar/*.aar
          retention-days: 90

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mediainfo-demo-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
          retention-days: 90

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mediainfo-demo-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: all-build-outputs
          path: |
            mediainfo-lib/build/outputs/
            app/build/outputs/
          retention-days: 30

      - name: Upload build reports
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 90

      - name: Build summary
        if: success()
        run: |
          echo "## Build Summary 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Successfully Built:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ MediaInfo Library (AAR)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ MediaInfo Demo App (Debug APK)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ MediaInfo Demo App (Release APK)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts:" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 AAR: \`mediainfo-lib/build/outputs/aar/\`" >> $GITHUB_STEP_SUMMARY
          echo "- 📱 Debug APK: \`app/build/outputs/apk/debug/\`" >> $GITHUB_STEP_SUMMARY
          echo "- 📱 Release APK: \`app/build/outputs/apk/release/\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            DEBUG_SIZE=$(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)
            echo "- Debug APK Size: $DEBUG_SIZE" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            RELEASE_SIZE=$(du -h app/build/outputs/apk/release/app-release-unsigned.apk | cut -f1)
            echo "- Release APK Size: $RELEASE_SIZE" >> $GITHUB_STEP_SUMMARY
          fi
