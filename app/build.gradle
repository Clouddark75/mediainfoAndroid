plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'net.mediaarea.mediainfo.demo'
    compileSdk 36

    defaultConfig {
        applicationId "net.mediaarea.mediainfo.demo"
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (System.getenv("SIGNING_KEYSTORE_PATH") != null) {
                storeFile file(System.getenv("SIGNING_KEYSTORE_PATH"))
                storePassword System.getenv("SIGNING_KEYSTORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS")
                keyPassword System.getenv("SIGNING_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile(
                'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    def prebuiltAarDir = file("${rootProject.projectDir}/mediainfo-lib/prebuilt")
    def forceAar = System.getenv("USE_PREBUILT_AAR") == "true"

    if ((forceAar || prebuiltAarDir.exists()) && prebuiltAarDir.listFiles()?.length > 0) {
        implementation fileTree(dir: prebuiltAarDir, include: ["*.aar"])
    } else {
        implementation project(":mediainfo-lib")
    }

    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
